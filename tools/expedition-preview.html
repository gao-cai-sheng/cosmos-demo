<aside><small>COSMOS / EXPEDITION</small><h1>NX07 与 ARES 06</h1><p>85 米探索飞船 · 六轮物流火星车<br>四足八字支撑 · 腹部升降装卸</p><div id="status">加载 Blender 资产…</div><p><button id="doors">打开腹舱</button><button id="cargo">卸载火星车</button><button id="fly">起飞 / 收起落架</button><button id="view">腹部视角</button><button id="reset">复位视角</button></p><a href="mars-vista.html">进入火星游戏 →</a></aside><span id="loading"></span><footer>拖动旋转 · 滚轮缩放 · 本页与游戏使用同一资产和联锁</footer>
<script type="module">
import * as T from 'three';import {createNX07} from '../src/journey/nx07-model.js';import {createAres} from '../src/journey/ares-model.js';
const scene=new T.Scene();scene.background=new T.Color(0x202b34);scene.fog=new T.Fog(0x202b34,180,480);const camera=new T.PerspectiveCamera(42,innerWidth/innerHeight,.1,1500);const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;document.body.prepend(renderer.domElement);
scene.add(new T.HemisphereLight(0xdcecff,0x756356,3));const sun=new T.DirectionalLight(0xffe6c8,4);sun.position.set(-40,80,45);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-90,right:90,top:90,bottom:-90,far:250});sun.shadow.normalBias=.09;scene.add(sun);const fill=new T.DirectionalLight(0x9dd2ff,2);fill.position.set(30,12,-40);scene.add(fill);
const ground=new T.Mesh(new T.PlaneGeometry(600,600),new T.MeshStandardMaterial({color:0x555c5d,roughness:.92}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const ship=createNX07();scene.add(ship.group);ship.fitGround(()=>0,()=>false,{snap:true});ship.setRoverCargoVisible(false);const rover=createAres();scene.add(rover.group);rover.group.position.set(0,0,-51);rover.group.visible=false;
let airborne=false,heading=.70,pitch=.27,distance=150,targetY=ship.group.position.y,drag=false,lastX,lastY,under=false,loaded=true,busy=false;const $=id=>document.getElementById(id);
await Promise.all([ship.ready,rover.ready]).catch(e=>{$('status').textContent='资产加载失败，请刷新重试';throw e;});$('loading').textContent='';
$('doors').onclick=()=>ship.setDoor(!ship.doorOpen);
$('reset').onclick=()=>{heading=.70;pitch=.27;distance=150;under=false;ground.visible=true;};
$('cargo').onclick=async()=>{if(busy)return;busy=true;try{if(!ship.doorOpen)ship.setDoor(true);await new Promise(r=>{const check=()=>ship.doorReady?r():requestAnimationFrame(check);check();});if(loaded){await ship.unload();rover.group.visible=true;loaded=false;}else{rover.group.visible=false;await ship.load();loaded=true;}}finally{busy=false;}};
$('fly').onclick=()=>{if(airborne){airborne=false;targetY=10.5;ship.prepareLanding(()=>0,()=>false);ship.deployGear();}else if(ship.requestTakeoff()){airborne=true;targetY=34;}};
$('view').onclick=()=>{under=!under;pitch=under?-.15:.27;ground.visible=!under;};
renderer.domElement.onpointerdown=e=>{drag=true;lastX=e.clientX;lastY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);};renderer.domElement.onpointermove=e=>{if(!drag)return;heading-=(e.clientX-lastX)*.006;pitch=T.MathUtils.clamp(pitch+(e.clientY-lastY)*.005,-1.2,1.4);lastX=e.clientX;lastY=e.clientY;};renderer.domElement.onpointerup=()=>drag=false;renderer.domElement.onwheel=e=>{e.preventDefault();distance=T.MathUtils.clamp(distance*Math.exp(e.deltaY*.001),30,350);};
let last=performance.now();function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;ship.update(dt);ship.group.position.y=T.MathUtils.damp(ship.group.position.y,targetY,1.2,dt);if(!airborne&&Math.abs(ship.group.position.y-10.5)<.03&&!ship.supportReady)ship.fitGround(()=>0);const target=new T.Vector3(0,10,-4);camera.position.set(Math.sin(heading)*distance,10+Math.sin(pitch)*distance,Math.cos(heading)*distance);camera.lookAt(target);camera.setViewOffset(innerWidth,innerHeight,innerWidth>800?-innerWidth*.10:0,0,innerWidth,innerHeight);renderer.render(scene,camera);$('status').textContent=ship.status;$('doors').textContent=ship.doorOpen?'关闭腹舱':'打开腹舱';$('doors').disabled=airborne||busy||!ship.supportReady;$('cargo').disabled=airborne||busy||!ship.supportReady;$('cargo').textContent=loaded?'卸载火星车':'装车回舱';$('fly').disabled=busy||(!airborne&&!ship.doorClosed);$('fly').textContent=airborne?'降落 / 展开起落架':'起飞 / 收起落架';requestAnimationFrame(loop);}requestAnimationFrame(loop);
addEventListener('resize',()=>{renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();});
