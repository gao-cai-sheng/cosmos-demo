<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js"}}</script>
<header><small>COSMOS / KESTREL</small><h1>游隼 · 三舱式探索飞行器</h1><p>拖动旋转 · 滚轮缩放</p></header><nav><button data-view="hero">透视</button><button data-view="top">俯视</button><button data-view="front">正视</button><button data-view="side">侧视</button><button data-view="belly">腹部</button></nav>
<script type="module">
import * as THREE from 'three';
import {createFlyer} from '../src/journey/flight.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xdde2e3);
const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.1,200);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;document.body.append(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x66757b,2.3));const sun=new THREE.DirectionalLight(0xfff9ed,3.2);sun.position.set(-12,24,15);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-15,right:15,top:15,bottom:-15});sun.shadow.normalBias=.035;scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:0xcbd3d5,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(100,100,0xb4c0c4,0xc2cccf);grid.position.y=.005;scene.add(grid);
const flyer=createFlyer({scene,camera,canvas:renderer.domElement,heightAt:()=>0,blocked:()=>false,ceilingAt:()=>0,site:{lat:0,lon:0},onBoard(){},onLand(){},onOrbit(){},notify(){}});flyer.park({x:0,z:0});
let az=.72,el=.48,radius=29;
const views={hero:[.72,.48,29],top:[0,Math.PI/2-.001,31],front:[0,.13,29],side:[Math.PI/2,.12,29],belly:[.6,-.5,29]};
function render(){camera.position.set(Math.sin(az)*Math.cos(el)*radius,2.8+Math.sin(el)*radius,Math.cos(az)*Math.cos(el)*radius);camera.lookAt(0,2.8,0);floor.visible=grid.visible=el>=0;renderer.render(scene,camera);}
for(const b of document.querySelectorAll('button'))b.onclick=()=>{[az,el,radius]=views[b.dataset.view];render();};
let drag=null;renderer.domElement.onpointerdown=e=>{drag=[e.clientX,e.clientY];renderer.domElement.setPointerCapture(e.pointerId);};renderer.domElement.onpointermove=e=>{if(!drag)return;az-=(e.clientX-drag[0])*.008;el=THREE.MathUtils.clamp(el+(e.clientY-drag[1])*.008,-1.5,1.57);drag=[e.clientX,e.clientY];render();};renderer.domElement.onpointerup=renderer.domElement.onpointercancel=()=>drag=null;renderer.domElement.onwheel=e=>{e.preventDefault();radius=THREE.MathUtils.clamp(radius+e.deltaY*.025,17,60);render();};onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);render();};render();
window.__KESTREL_PREVIEW={renderer,scene,camera};
