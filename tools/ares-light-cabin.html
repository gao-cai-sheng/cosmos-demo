<style>*{box-sizing:border-box}body{margin:0;background:#e5e8e9;color:#253a43;font:14px system-ui}canvas{display:block}header{position:absolute;top:20px;left:24px;max-width:580px;pointer-events:none}h1{font-size:24px;margin:5px 0}p{line-height:1.55;margin:5px 0}aside{position:absolute;top:20px;right:20px;width:300px;background:#fffffff0;border:1px solid #bdc8cc;padding:15px;border-radius:6px}aside p{font-size:12px}summary{cursor:pointer;font-weight:550;margin-bottom:6px}#measure{white-space:pre-line;font-variant-numeric:tabular-nums;line-height:1.7;font-size:13px}#issue{color:#8e4822}nav{position:absolute;left:24px;right:24px;bottom:20px;display:flex;flex-wrap:wrap;gap:8px}button,a{border:1px solid #a2b0b6;background:#fffffff0;padding:9px 12px;border-radius:5px;color:inherit;font:inherit;cursor:pointer;text-decoration:none}button[aria-pressed=true]{background:#284851;color:white}#loading{position:absolute;left:24px;bottom:75px} @media(max-width:650px){header{left:14px;right:14px;top:12px}h1{font-size:20px}header p{font-size:12px}aside{top:105px;right:14px;width:240px;padding:10px}aside p{font-size:11px}#measure{font-size:11px}nav{left:14px;right:14px;bottom:14px;gap:5px}button,a{font-size:12px;padding:7px 9px}#loading{bottom:115px;left:14px}}

<script type="importmap">{"imports":{"three":"../vendor/three/three.module.js","three/addons/":"../vendor/three/examples/jsm/"}}</script>
<header><small>COSMOS / L04 · 布局白模</small><h1>双人并排 · 原车体试坐</h1><p>双座、背包避让支架与两套操作台白模；车体、轮距保持现状。<br>这是空间试验，尚未实现第二名乘员登乘。</p></header>
<aside><details id="diagnostics" open><summary>空间检查与边界</summary><div id="measure">测量中…</div><p id="issue"></p><p>车门开通暂缓。绿色框仅为预留入口，可按需显示。操作台是布局占位，不显示游戏遥测。后舱净高 1.78 m，不按站立走廊处理。</p></details></aside>
<div id="loading">正在加载车体与两套独立 EVA 骨架…</div><nav><button data-view="front">座舱剖视</button><button data-view="top">俯视布局</button><button data-view="side">侧面布局</button><button data-view="whole">完整车体</button><button data-view="driver">驾驶位视点</button><button data-view="operator">任务位视点</button><button id="preset" aria-pressed="false">比较原座位位置</button><button id="doors" aria-pressed="false">入口候选</button><a href="ares-light-preview.html">返回外观</a></nav>
<script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {createCabinStudy,skinBounds,LAYOUT} from '../src/journey/light-cabin-layout.js';
const scene=new T.Scene();scene.background=new T.Color(0xe5e8e9);const camera=new T.PerspectiveCamera(35,innerWidth/innerHeight,.05,180);
const renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.localClippingEnabled=true;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.NoToneMapping;document.body.append(renderer.domElement);
const controls={target:new T.Vector3(),update(){camera.lookAt(this.target);render();}};
let drag=null;renderer.domElement.onpointerdown=e=>{const v=camera.position.clone().sub(controls.target);drag={x:e.clientX,y:e.clientY,az:Math.atan2(v.x,v.z),el:Math.asin(v.y/v.length()),r:v.length()};renderer.domElement.setPointerCapture(e.pointerId);};
renderer.domElement.onpointermove=e=>{if(!drag)return;drag.az-=(e.clientX-drag.x)*.008;drag.el=T.MathUtils.clamp(drag.el+(e.clientY-drag.y)*.008,-1.5,1.5);drag.x=e.clientX;drag.y=e.clientY;camera.position.copy(controls.target).add(new T.Vector3(Math.sin(drag.az)*Math.cos(drag.el),Math.sin(drag.el),Math.cos(drag.az)*Math.cos(drag.el)).multiplyScalar(drag.r));controls.update();};
renderer.domElement.onpointerup=renderer.domElement.onpointercancel=()=>drag=null;renderer.domElement.onwheel=e=>{e.preventDefault();const v=camera.position.clone().sub(controls.target);v.setLength(T.MathUtils.clamp(v.length()+e.deltaY*.01,2,60));camera.position.copy(controls.target).add(v);controls.update();};
scene.add(new T.HemisphereLight(0xffffff,0x7a8a93,2.4));const sun=new T.DirectionalLight(0xffffff,2);sun.position.set(-6,12,10);scene.add(sun);
const diagnostics=document.querySelector('#diagnostics');const narrow=matchMedia('(max-width:650px)');diagnostics.open=!narrow.matches;narrow.addEventListener('change',()=>diagnostics.open=!narrow.matches);
let study,vehicle,view='front',old=false;const section=new T.Plane(new T.Vector3(0,-1,0),2.34),doors=new T.Group();doors.name='proposed entry volumes';doors.visible=false;scene.add(doors);
function render(){renderer.render(scene,camera)}
function setView(next){view=next;const whole=next==='whole';camera.fov=next==='driver'||next==='operator'?68:35;camera.updateProjectionMatrix();for(const c of study.crew)c.rig.helmet.visible=true;vehicle.traverse(o=>{if(o.isMesh)for(const m of [].concat(o.material))m.clippingPlanes=whole?[]:[section];});
 if(next==='driver'||next==='operator'){const c=study.crew[next==='driver'?0:1];c.rig.helmet.visible=false;camera.position.copy(new T.Vector3(0,.86,.12).applyQuaternion(c.root.quaternion).add(c.hip));controls.target.copy(camera.position).add(new T.Vector3(0,-.15,1));camera.lookAt(controls.target);render();for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b.dataset.view===next));return;}
 const target=whole?new T.Vector3(0,2.4,.4):new T.Vector3(0,2.95,2.65);const distance=(whole?17:7.4)/Math.min(1,camera.aspect);const dir=next==='top'?new T.Vector3(0,1,.001):next==='side'?new T.Vector3(1,.17,0):new T.Vector3(.33,.3,1);
 controls.target.copy(target);camera.position.copy(target).add(dir.normalize().multiplyScalar(distance));camera.lookAt(target);controls.update();render();for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b.dataset.view===next));}
// Geometry probes are conservative boxes against real triangle surfaces. They are not an EVA movement certificate.
function hits(box){const out=[];const tri=new T.Triangle();vehicle.updateMatrixWorld(true);vehicle.traverse(o=>{if(!o.isMesh)return;const g=o.geometry;if(!g.boundingBox)g.computeBoundingBox();if(!g.boundingBox.clone().applyMatrix4(o.matrixWorld).intersectsBox(box))return;const a=g.attributes.position,idx=g.index;for(let i=0,n=idx?idx.count:a.count;i<n;i+=3){tri.a.fromBufferAttribute(a,idx?idx.getX(i):i).applyMatrix4(o.matrixWorld);tri.b.fromBufferAttribute(a,idx?idx.getX(i+1):i+1).applyMatrix4(o.matrixWorld);tri.c.fromBufferAttribute(a,idx?idx.getX(i+2):i+2).applyMatrix4(o.matrixWorld);if(box.intersectsTriangle(tri)){out.push(o.name);break;}}});return out;}
function verticalHit(x,z,top,min,max){const ray=new T.Raycaster(new T.Vector3(x,top,z),new T.Vector3(0,-1,0));return ray.intersectObject(vehicle,true).find(h=>h.point.y>=min&&h.point.y<=max)?.point.y??null;}
function metrics(){const crew=study.crew.map(c=>{const b=skinBounds(c.root),h=skinBounds(c.root,o=>o.name.includes('Helmet'));return {bounds:{min:b.min.toArray(),max:b.max.toArray()},helmet:{min:h.min.toArray(),max:h.max.toArray()},bodyProbe:hits(b),helmetProbe:hits(h),floorTop:verticalHit(c.hip.x,(b.min.z+b.max.z)/2,2.60,1.85,2.35),floorClearance:b.min.y-(verticalHit(c.hip.x,(b.min.z+b.max.z)/2,2.60,1.85,2.35)??b.min.y),roofClearance:Math.min(...[h.min.x,(h.min.x+h.max.x)/2,h.max.x].flatMap(x=>[h.min.z,(h.min.z+h.max.z)/2,h.max.z].map(z=>(verticalHit(x,z,4.3,2.8,4.1)??4.1)-h.max.y)))};});
 const gap=crew[1].bounds.min[0]-crew[0].bounds.max[0];const seatWidth=old?.86:1.10;
 const report={layout:old?'inherited driver position mirrored':'rearward wider pair',hipY:old?2.37:LAYOUT.hipY,hipZ:old?2.65:LAYOUT.hipZ,hipSpacing:seatWidth,suitScale:[1,1,1],crew,gap,doorProbes:doors.children.map(o=>({side:o.position.x,hits:hits(new T.Box3().setFromObject(o))})),vehicleBounds:new T.Box3().setFromObject(vehicle),scope:'Conservative deformed-suit AABB vs real triangles. Overlaps flag candidates for diagnosis, not exact penetration. Entrances not open; no path certification.'};
 window.__CABIN.metrics=report;document.querySelector('#measure').textContent=`座位中心距 ${seatWidth.toFixed(2)} m
坐姿外包络横向间隔 ${gap.toFixed(3)} m
舱底单点采样 ${Math.min(...crew.map(c=>c.floorClearance)).toFixed(3)} m
舱顶九点采样 ${Math.min(...crew.map(c=>c.roofClearance)).toFixed(3)} m
头盔顶高 ${Math.max(...crew.map(c=>c.helmet.max[1])).toFixed(3)} m
车体 8.52 × 5.90 × 5.41 m
轮心横距 4.36 m · 保持不变`;
 const suspect=crew.reduce((n,c)=>n+c.helmetProbe.length,0);document.querySelector('#issue').textContent=`${gap>0?'两人横向外包络分离':'两人横向外包络重叠'}；${Math.min(...crew.map(c=>c.floorClearance))<0?'舱底包络交叠，原位置待修正；':''}头盔包络与车体三角面${suspect?'有交叠候选':'未检出交叠'}；${old?'原位置只作对照，尚未验收':'当前静态人体/头盔对原车与避让框架/操作台未检出表面交叠'}。安装处仍有支座/舱底交叠；车门与进出动作按决定暂缓。`;return report;}
try{
 [vehicle,study]=await Promise.all([new GLTFLoader().loadAsync('../assets/models/ares-light.glb').then(g=>g.scene),createCabinStudy()]);
 vehicle.traverse(o=>{if(o.isMesh){const array=Array.isArray(o.material);const mats=[].concat(o.material).map(m=>{m=m.clone();m.color.set(0xb7c0c5);m.metalness=.1;m.roughness=.9;m.side=T.DoubleSide;m.transparent=false;m.opacity=1;return m;});o.material=array?mats:mats[0];}});scene.add(vehicle,study.group);
 for(const sign of [-1,1]){const box=new T.Mesh(new T.BoxGeometry(.12,1.10,.80),new T.MeshBasicMaterial({color:0x27826c,wireframe:true}));box.name='entry proposal '+sign;box.position.set(sign*1.50,2.65,2.15);doors.add(box);}
 window.__CABIN={scene,camera,renderer,controls,vehicle,study,doors,setView,metrics:null,recompute:metrics};metrics();setView(view);document.querySelector('#loading').textContent='拖动旋转 · 滚轮缩放 · 剖视只裁切车壳显示，不改变测量几何';
 for(const b of document.querySelectorAll('[data-view]'))b.onclick=()=>setView(b.dataset.view);
 document.querySelector('#preset').onclick=e=>{old=!old;study.setLayout(old?{halfSpacing:.43,hipZ:2.65,hipY:2.37}:{});e.target.setAttribute('aria-pressed',String(old));metrics();setView(view);};
 document.querySelector('#doors').onclick=e=>{doors.visible=!doors.visible;e.target.setAttribute('aria-pressed',String(doors.visible));render();};
 onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);setView(view);};
}catch(e){document.querySelector('#loading').textContent='加载失败，可刷新重试：'+e.message;console.error(e);}
</script></html>
